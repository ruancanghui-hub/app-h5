# aigrowpark.com - App H5 静态站点
# 放置路径（宝塔环境）: /www/server/panel/vhost/nginx/aigrowpark.com.conf
# 或标准路径:          /etc/nginx/conf.d/aigrowpark.com.conf

server {
    listen 80;
    listen [::]:80;
    server_name aigrowpark.com www.aigrowpark.com;

    root /www/wwwroot/aigrowpark.com;
    index index.html;

    access_log /www/wwwlogs/aigrowpark.com.log;
    error_log  /www/wwwlogs/aigrowpark.com.error.log;

    charset utf-8;

    # SPA 回退：hash 路由理论上不需要，但保留以防将来改成 history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 不缓存，保证发版后用户立刻拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # 带 hash 的静态资源可长期缓存
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 隐藏文件
    location ~ /\. {
        deny all;
    }
}
