# h5.aigrowpark.com —— App H5 静态站点
# 站点目录: /www/wwwroot/h5.aigrowpark.com

server {
    listen 80;
    listen [::]:80;
    server_name h5.aigrowpark.com;

    root /www/wwwroot/h5.aigrowpark.com;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    access_log /usr/local/nginx/logs/h5.aigrowpark.access.log;
    error_log  /usr/local/nginx/logs/h5.aigrowpark.error.log warn;

    # ACME 证书验证路径 —— 必须放在 `location ~ /\.` 之前，
    # 且用 ^~ 前缀以优先于正则 location，否则会被下面的 deny 规则拦成 403
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/h5.aigrowpark.com;
        allow all;
        access_log off;
    }

    # SPA 回退（hash 路由本不需要，保留以防将来改 history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 不缓存，保证发版立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # 带 hash 的静态资源长期缓存
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript
               application/javascript application/json
               application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;

    location ~ /\. {
        deny all;
    }
}
