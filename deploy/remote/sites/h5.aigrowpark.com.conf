# h5.aigrowpark.com —— App H5 站点 + 运营后台
#
#   客户端页面 : https://h5.aigrowpark.com/           公开
#   运营后台   : https://h5.aigrowpark.com/admin      basic auth 保护
#   API 后端   : 127.0.0.1:3900  (pm2 应用 app-h5-api，仅监听本机)
#
# 站点目录: /www/wwwroot/h5.aigrowpark.com
# 口令文件: /etc/nginx/htpasswd  （注意：不能放 /usr/local/nginx/conf/，
#           该目录是 750 root:root，nginx worker 以 nobody 运行，进不去会 500）

# ---------- HTTP：全部跳转 HTTPS，仅放行 ACME 续期验证 ----------
server {
    listen 80;
    listen [::]:80;
    server_name h5.aigrowpark.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/h5.aigrowpark.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name h5.aigrowpark.com;

    ssl_certificate     /usr/local/nginx/conf/ssl/h5.aigrowpark.com/fullchain.pem;
    ssl_certificate_key /usr/local/nginx/conf/ssl/h5.aigrowpark.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /www/wwwroot/h5.aigrowpark.com;
    index index.html;
    charset utf-8;
    client_max_body_size 20m;

    access_log /usr/local/nginx/logs/h5.aigrowpark.access.log;
    error_log  /usr/local/nginx/logs/h5.aigrowpark.error.log warn;

    # SPA 回退（hash 路由本不需要，保留以防将来改 history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 不缓存，保证发版立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # ============ 运营后台入口（访问保护）============
    location = /admin {
        auth_basic "Ops Console";
        auth_basic_user_file /etc/nginx/htpasswd;
        try_files /admin.html =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /admin/ {
        return 301 /admin;
    }

    location = /admin.html {
        auth_basic "Ops Console";
        auth_basic_user_file /etc/nginx/htpasswd;
        try_files /admin.html =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ============ 运营数据接口（同样加保护）============
    # 必须保护：否则绕过页面直接请求接口即可拿到全部反馈与联系方式
    location ^~ /api/ops/ {
        auth_basic "Ops Console";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============ 客户端反馈提交接口（公开）============
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 带 hash 的静态资源长期缓存
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript
               application/javascript application/json
               application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;

    # 拒绝访问隐藏文件（ACME 路径已用 ^~ 单独放行）
    location ~ /\. {
        deny all;
    }
}
