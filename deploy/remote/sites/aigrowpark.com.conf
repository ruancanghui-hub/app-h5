# aigrowpark.com 主站 —— 反向代理到 Next.js（idea-website）
# 原应用直接监听 80，现改由 Nginx 接管 80 并转发到 127.0.0.1:3001

server {
    listen 80;
    listen [::]:80;
    server_name aigrowpark.com www.aigrowpark.com;

    client_max_body_size 50m;

    access_log /usr/local/nginx/logs/aigrowpark.access.log;
    error_log  /usr/local/nginx/logs/aigrowpark.error.log warn;

    location / {
        proxy_pass http://idea_website;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Next.js 自身带压缩与缓存头，交给它处理
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # 健康检查用
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
